<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SQLite driver spike</title>
    <style>
      body { font-family: -apple-system, sans-serif; padding: 16px; background: #111; color: #eee; }
      pre { white-space: pre-wrap; word-break: break-all; background: #222; padding: 12px; border-radius: 6px; }
      button { padding: 8px 16px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>better-sqlite3 spike</h1>
    <button id="run">Run SQLite flow</button>
    <pre id="output">(pending)</pre>
    <script>
      const out = document.getElementById('output');
      document.getElementById('run').addEventListener('click', async () => {
        out.textContent = 'running...';
        const result = await window.sqliteSpike.run();
        out.textContent = JSON.stringify(result, null, 2);
      });
      // auto-run on load para poder validar también sin interacción (logs de main visibles en consola empaquetada)
      window.sqliteSpike.run().then((result) => {
        out.textContent = JSON.stringify(result, null, 2);
      });
    </script>
  </body>
</html>
